<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="gn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
  </defs>
  <!-- Rounded square container -->
  <rect x="4" y="8" width="64" height="64" rx="16" fill="url(#gn-grad)" />
  <!-- G letter -->
  <text x="15" y="54" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', monospace" font-size="28" font-weight="700" fill="#FFFFFF" opacity="0.95">G</text>
  <!-- N letter -->
  <text x="37" y="54" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', monospace" font-size="28" font-weight="700" fill="#FFFFFF" opacity="0.6">N</text>
  <!-- Commit dot accent -->
  <circle cx="60" cy="18" r="4" fill="#FFFFFF" opacity="0.8" />
  <!-- Wordmark -->
  <text x="82" y="50" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', monospace" font-size="30" font-weight="700" fill="#E8E2D6" letter-spacing="-0.5">git</text>
  <text x="142" y="50" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', monospace" font-size="30" font-weight="700" fill="url(#gn-grad)" letter-spacing="-0.5">narrate</text>
</svg>
