name: Dependency Check

on:
  push:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/dependency-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/dependency-audit.yml'
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 9am UTC

jobs:
  audit:
    name: Validate Dependency Graph
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Resolve dependencies
        run: swift package resolve

      - name: Validate dependency graph
        run: swift package show-dependencies --format json | python3 -m json.tool
