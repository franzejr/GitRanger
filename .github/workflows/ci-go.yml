name: Go CLI

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - ".github/workflows/ci-go.yml"
  pull_request:
    branches: [main]
    paths:
      - "cli/**"
      - ".github/workflows/ci-go.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./... -count=1
      - name: Build
        run: go build -trimpath ./cmd/gitranger
