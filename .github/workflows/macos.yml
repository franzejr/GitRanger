name: macOS Build & Lint

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - '.swiftlint.yml'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - '.swiftlint.yml'
      - '.github/workflows/**'

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  build:
    name: Build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: swift build -c release

      - name: Run Tests
        run: swift test
