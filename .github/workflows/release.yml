name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Package
    runs-on: macos-14
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4

      - name: Build release binary
        run: swift build -c release

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Create app bundle
        run: |
          APP_DIR="GitNarrate.app/Contents/MacOS"
          mkdir -p "$APP_DIR"
          cp .build/release/GitNarrate "$APP_DIR/GitNarrate"

          cat > "GitNarrate.app/Contents/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>GitNarrate</string>
            <key>CFBundleIdentifier</key>
            <string>com.gitnarrate.app</string>
            <key>CFBundleName</key>
            <string>GitNarrate</string>
            <key>CFBundleVersion</key>
            <string>${{ steps.version.outputs.VERSION }}</string>
            <key>CFBundleShortVersionString</key>
            <string>${{ steps.version.outputs.VERSION }}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>14.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Create ZIP archive
        run: |
          ditto -c -k --keepParent GitNarrate.app GitNarrate-${{ steps.version.outputs.VERSION }}-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitNarrate-${{ steps.version.outputs.VERSION }}-macos
          path: macos/GitNarrate-${{ steps.version.outputs.VERSION }}-macos.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: macos/GitNarrate-${{ steps.version.outputs.VERSION }}-macos.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
