name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          BUILD=$(git rev-list --count HEAD)
          VERSION="${GITHUB_REF#refs/tags/v}"
          TAG="${GITHUB_REF#refs/tags/}"

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "BUILD=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (build $BUILD), tag: $TAG"

      - name: Generate changelog
        id: changelog
        run: |
          CURRENT_TAG="${{ steps.version.outputs.TAG }}"

          # Ignore legacy auto-release tags containing build metadata.
          PREV_TAG=$(git tag --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -v "^${CURRENT_TAG}$" \
            | head -1 || true)

          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
            SINCE_LABEL="initial release"
          else
            RANGE="${PREV_TAG}..HEAD"
            SINCE_LABEL="since ${PREV_TAG}"
          fi

          {
            echo "CHANGELOG<<CHANGELOG_EOF"
            echo "### What's Changed (${SINCE_LABEL})"
            echo ""
            git log "$RANGE" --pretty=format:"- %s (%h)" --no-merges 2>/dev/null || echo "- Initial release"
            echo ""
            echo ""
            echo "### Installation"
            echo ""
            echo "1. Download \`GitRanger-${{ steps.version.outputs.VERSION }}-macos.zip\` below"
            echo "2. Unzip and move \`GitRanger.app\` to your Applications folder"
            echo "3. On first launch, **right-click** the app and choose **Open** (macOS blocks unsigned apps on double-click)"
            echo "4. Click **Open** in the confirmation dialog"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: swift build -c release

      - name: Create app bundle
        run: |
          APP_DIR="GitRanger.app/Contents/MacOS"
          mkdir -p "$APP_DIR"
          cp .build/release/GitRanger "$APP_DIR/GitRanger"

          # Copy bundled resources
          RESOURCES_DIR="GitRanger.app/Contents/Resources"
          mkdir -p "$RESOURCES_DIR"
          BUNDLE_PATH=".build/release/GitRanger_GitRanger.bundle"
          if [ -d "$BUNDLE_PATH" ]; then
            echo "Found resource bundle at: $BUNDLE_PATH"
            cp -R "$BUNDLE_PATH" "$RESOURCES_DIR/"
          else
            echo "WARNING: Resource bundle not found"
          fi

          cat > "GitRanger.app/Contents/Info.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>GitRanger</string>
            <key>CFBundleIdentifier</key>
            <string>com.gitnarrate.app</string>
            <key>CFBundleName</key>
            <string>GitRanger</string>
            <key>CFBundleVersion</key>
            <string>${{ steps.version.outputs.BUILD }}</string>
            <key>CFBundleShortVersionString</key>
            <string>${{ steps.version.outputs.VERSION }}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>LSMinimumSystemVersion</key>
            <string>14.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

          # Copy app icon into bundle Resources
          if [ -f Sources/GitRanger/Resources/AppIcon.icns ]; then
            cp Sources/GitRanger/Resources/AppIcon.icns "$RESOURCES_DIR/AppIcon.icns"
          fi

      - name: Ad-hoc code sign
        run: codesign --sign "-" --force --deep GitRanger.app

      - name: Create ZIP archive
        run: |
          ditto -c -k --keepParent GitRanger.app \
            "GitRanger-${{ steps.version.outputs.VERSION }}-macos.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: GitRanger ${{ steps.version.outputs.VERSION }} (build ${{ steps.version.outputs.BUILD }})
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          files: GitRanger-${{ steps.version.outputs.VERSION }}-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: GitRanger-${{ steps.version.outputs.VERSION }}-build${{ steps.version.outputs.BUILD }}-macos
          path: GitRanger-${{ steps.version.outputs.VERSION }}-macos.zip
