name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAG="${GITHUB_REF#refs/tags/}"
            PRERELEASE="false"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            DATE=$(date -u +%Y%m%d)
            VERSION="0.0.0-dev.${DATE}.${SHORT_SHA}"
            TAG="dev-${DATE}-${SHORT_SHA}"
            PRERELEASE="true"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          # Find the previous release tag (or use root if none)
          PREV_TAG=$(git tag --sort=-creatordate | grep -E '^(v|dev-)' | head -1 || echo "")

          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi

          # Generate categorized changelog from commits
          {
            echo "CHANGELOG<<CHANGELOG_EOF"

            FEATURES=$(git log "$RANGE" --pretty=format:"- %s (%h)" --grep="^Add\|^feat\|^Feature" -i 2>/dev/null || echo "")
            FIXES=$(git log "$RANGE" --pretty=format:"- %s (%h)" --grep="^Fix\|^fix:" -i 2>/dev/null || echo "")
            OTHER=$(git log "$RANGE" --pretty=format:"- %s (%h)" --invert-grep --grep="^Add\|^feat\|^Feature\|^Fix\|^fix:" -i 2>/dev/null || echo "")

            if [ -n "$FEATURES" ]; then
              echo "### Features"
              echo "$FEATURES"
              echo ""
            fi

            if [ -n "$FIXES" ]; then
              echo "### Fixes"
              echo "$FIXES"
              echo ""
            fi

            if [ -n "$OTHER" ]; then
              echo "### Other"
              echo "$OTHER"
              echo ""
            fi

            # If nothing was categorized, just list all commits
            if [ -z "$FEATURES" ] && [ -z "$FIXES" ] && [ -z "$OTHER" ]; then
              echo "### Changes"
              git log "$RANGE" --pretty=format:"- %s (%h)" 2>/dev/null || echo "- Initial release"
              echo ""
            fi

            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: swift build -c release

      - name: Create app bundle
        run: |
          APP_DIR="GitNarrate.app/Contents/MacOS"
          mkdir -p "$APP_DIR"
          cp .build/release/GitNarrate "$APP_DIR/GitNarrate"

          # Copy bundled resources
          RESOURCES_DIR="GitNarrate.app/Contents/Resources"
          mkdir -p "$RESOURCES_DIR"
          if [ -d .build/release/GitNarrate_GitNarrate.bundle ]; then
            cp -R .build/release/GitNarrate_GitNarrate.bundle "$RESOURCES_DIR/"
          fi

          cat > "GitNarrate.app/Contents/Info.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>GitNarrate</string>
            <key>CFBundleIdentifier</key>
            <string>com.gitnarrate.app</string>
            <key>CFBundleName</key>
            <string>GitNarrate</string>
            <key>CFBundleVersion</key>
            <string>${{ steps.version.outputs.VERSION }}</string>
            <key>CFBundleShortVersionString</key>
            <string>${{ steps.version.outputs.VERSION }}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>LSMinimumSystemVersion</key>
            <string>14.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

          # Copy app icon into bundle Resources
          if [ -f Sources/GitNarrate/Resources/AppIcon.icns ]; then
            cp Sources/GitNarrate/Resources/AppIcon.icns "$RESOURCES_DIR/AppIcon.icns"
          fi

      - name: Create ZIP archive
        run: |
          ditto -c -k --keepParent GitNarrate.app \
            "GitNarrate-${{ steps.version.outputs.VERSION }}-macos.zip"

      - name: Delete existing dev tag (if re-running)
        if: steps.version.outputs.PRERELEASE == 'true'
        run: |
          TAG="${{ steps.version.outputs.TAG }}"
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: ${{ steps.version.outputs.PRERELEASE == 'true' && format('Dev Build {0}', steps.version.outputs.VERSION) || steps.version.outputs.VERSION }}
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          prerelease: ${{ steps.version.outputs.PRERELEASE == 'true' }}
          files: GitNarrate-${{ steps.version.outputs.VERSION }}-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitNarrate-${{ steps.version.outputs.VERSION }}-macos
          path: GitNarrate-${{ steps.version.outputs.VERSION }}-macos.zip
