name: Binary Size Tracking

on:
  pull_request:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Package.swift'

jobs:
  size:
    name: Track Binary Size
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build PR branch (release)
        run: swift build -c release

      - name: Measure PR binary size
        id: pr
        run: |
          SIZE=$(stat -f%z .build/release/GitNarrate)
          echo "SIZE=$SIZE" >> "$GITHUB_OUTPUT"
          echo "PR binary size: $SIZE bytes ($(echo "scale=2; $SIZE/1048576" | bc) MB)"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          clean: false
          path: __base

      - name: Build base branch (release)
        id: base
        working-directory: __base
        run: |
          swift build -c release 2>/dev/null
          if [ -f .build/release/GitNarrate ]; then
            SIZE=$(stat -f%z .build/release/GitNarrate)
            echo "SIZE=$SIZE" >> "$GITHUB_OUTPUT"
          else
            echo "SIZE=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare sizes
        id: diff
        run: |
          PR=${{ steps.pr.outputs.SIZE }}
          BASE=${{ steps.base.outputs.SIZE }}

          if [ "$BASE" -eq 0 ]; then
            echo "COMMENT=**Binary size:** $(echo "scale=2; $PR/1048576" | bc) MB (new binary, no baseline)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DIFF=$((PR - BASE))
          PCT=$(echo "scale=2; ($DIFF * 100) / $BASE" | bc)
          PR_MB=$(echo "scale=2; $PR/1048576" | bc)
          BASE_MB=$(echo "scale=2; $BASE/1048576" | bc)
          DIFF_KB=$(echo "scale=1; $DIFF/1024" | bc)

          if [ "$DIFF" -gt 0 ]; then
            ICON="📈"
            SIGN="+"
          elif [ "$DIFF" -lt 0 ]; then
            ICON="📉"
            SIGN=""
          else
            ICON="➡️"
            SIGN=""
          fi

          MSG="$ICON **Binary size:** ${PR_MB} MB (${SIGN}${DIFF_KB} KB / ${SIGN}${PCT}% vs main at ${BASE_MB} MB)"
          echo "COMMENT=$MSG" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: binary-size
          message: ${{ steps.diff.outputs.COMMENT }}
