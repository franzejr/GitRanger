version: 2

project_name: gitranger

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: gitranger
    main: ./cmd/gitranger
    binary: gitranger
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - ids: [gitranger]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  use: git
