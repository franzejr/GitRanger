included:
  - Sources

excluded:
  - .build
  - Tests

line_length:
  warning: 120
  error: 150

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 50
  error: 80

disabled_rules:
  - trailing_comma
  - opening_brace
  - identifier_name
  - force_cast
  - type_name
  - nesting

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - empty_string
  - sorted_imports
  - redundant_nil_coalescing
